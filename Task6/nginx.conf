# Полная конфигурация Nginx: балансировка upstream + Rate Limiting
# Не более 10 запросов в минуту с одного IP; при превышении — HTTP 429.
# Имена backend* для docker-compose; в проде замените на FQDN (как в исходном задании).

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /var/log/nginx/access.log;

    # Ключ — IP клиента; rate=10r/m
    limit_req_zone $binary_remote_addr zone=partner_rl:10m rate=10r/m;

    # Настройка upstream для балансировки нагрузки
    upstream backend_servers {
        server backend1:8080;
        server backend2:8080;
        server backend3:8080;
    }

    server {
        listen 80;

        limit_req_status 429;

        location / {
            # rate=10r/m; burst=9+nodelay — до 10 успешных запросов при всплеске (burst=0 недопустим в nginx ≥1.27)
            limit_req zone=partner_rl burst=9 nodelay;
            proxy_pass http://backend_servers;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
